
<!-- K 线分片加载 + SVG 文本提示补丁 -->
<script>
(function(){
  var KLS={};
  window.kline=function(code,cb){
    var shard=code.slice(-1);
    var emit=function(d){
      var arr=d&&d[code];
      if(!arr||arr.length<25){cb(null);return}
      cb(arr.map(function(v){return{c:v[0]/100,o:v[1]/100,h:v[2]/100,l:v[3]/100}}));
    };
    if(KLS[shard]){emit(KLS[shard]);return}
    var el=document.getElementById('kline');
    if(el){el.setAttribute('viewBox','0 0 760 250');el.innerHTML='<text x="380" y="125" text-anchor="middle" font-size="11" fill="rgba(128,128,128,.75)">正在加载 K 线数据…</text>';}
    fetch('./data/klines_'+shard+'.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(d){KLS[shard]=d;emit(d)})
      .catch(function(){emit(null)});
  };
  var ok=window.drawKline;
  window.drawKline=function(bars,buyP,sellP){
    if(!bars){
      var el=document.getElementById('kline');
      if(el){
        el.setAttribute('viewBox','0 0 760 250');
        el.innerHTML='<text x="380" y="120" text-anchor="middle" font-size="11" fill="rgba(128,128,128,.8)">K 线数据暂不可用（分片加载失败或网络受限）</text>'+
          '<text x="380" y="140" text-anchor="middle" font-size="10" fill="rgba(128,128,128,.6)">网格档位与买卖价不受影响</text>';
      }
      return;
    }
    return ok(bars,buyP,sellP);
  };
})();
</script>
