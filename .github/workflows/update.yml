name: 每日更新行情快照并部署 Cloudflare Pages

on:
  schedule:
    # A 股 15:00 收盘，留 30 分钟等数据接口结算；UTC 08:30 = 北京时间 16:30
    - cron: "30 8 * * 1-5"
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: lowvol-daily
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取全市场数据
        run: python fetch.py

      - name: 校验数据完整性
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("docs/data/full.json", encoding="utf-8"))
          rows = d.get("rows") or d.get("items") or d.get("data") or []
          n = len(rows)
          print("rows =", n, "date =", d.get("date"), "universe =", d.get("universe"))
          # 覆盖率闸门：低于 4500 只说明抓取被限流，直接失败，避免发布残缺数据
          if n < 4500:
              sys.exit("数据覆盖不足（%d 只），疑似接口限流，已阻止发布" % n)
          PY

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少 CLOUDFLARE_API_TOKEN，请在仓库 Settings → Secrets 中配置"
            exit 1
          fi
          npx --yes wrangler@latest pages deploy ./docs \
            --project-name=lowvol-grid \
            --branch=main \
            --commit-dirty=true

      - name: 提交快照到仓库
        run: |
          git config user.name  "lowvol-bot"
          git config user.email "lowvol-bot@users.noreply.github.com"
          git add -A docs/data
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d') 行情快照"
            git push
          fi
