name: 每日更新行情快照

on:
  schedule:
    # A 股 15:00 收盘，留 30 分钟等数据接口结算；UTC 08:30 = 北京时间 16:30
    - cron: "30 8 * * 1-5"
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取全市场数据
        run: python fetch.py

      - name: 提交快照
        run: |
          git config user.name  "lowvol-bot"
          git config user.email "lowvol-bot@users.noreply.github.com"
          git add docs/data/full.json docs/data/klines.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d') 行情快照"
            git push
          fi
